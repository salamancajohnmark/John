<!DOCTYPE html>
<html>
<head>
  <title>Responsive Web Design Layout</title>
<style>
* {
  box-sizing: border-box;
}

body {
  font-family: 'Segoe UI', Arial, sans-serif;
  margin: 0;
  background: linear-gradient(135deg, #1e3c72, #2a5298);
  color: white;
  text-align: center;
}

/* Header */
.header {
  padding: 30px;
  text-align: center;
}

.header h1 {
  font-size: 50px;
  text-shadow: 1px 1px 4px rgba(0,0,0,0.5);
}

/* Navigation Bar */
.topnav {
  overflow: hidden;
  background-color: rgba(0,0,0,0.6);
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  padding: 10px 20px;

  position: sticky;
  top: 0;
  z-index: 1000;
}

.topnav a {
  color: white;
  text-align: center;
  padding: 12px 16px;
  text-decoration: none;
  font-weight: bold;
  transition: 0.3s;
}

.topnav a:hover {
  background-color: #1565c0;
  border-radius: 6px;
}

/* Columns */
.leftcolumn {   
  float: left;
  width: 100%;
  text-align: center;
}

.rightcolumn {
  float: left;
  width: 0%;
  padding-left: 20px;
}

/* Fake image */
.fakeimg {
  background-color: #aaa;
  width: 100%;
  padding: 20px;
}

/* Card Design */
.card {
  background: white;
  color: black;
  padding: 30px;
  margin: 30px auto;
  width: 85%;
  max-width: 1000px;
  border-radius: 12px;
  box-shadow: 0 8px 25px rgba(0,0,0,0.25);
  animation: fadeEffect 0.4s ease-in-out;
}

.card h1{
  color: #1565c0;
}

/* Video style */
.card-video{
  width: 100%;
  max-width: 700px;
  border-radius: 10px;
  box-shadow: 0 6px 20px rgba(0,0,0,0.3);
  margin-top: 20px;
}

/* Clear floats */
.row:after {
  content: "";
  display: table;
  clear: both;
}

/* Footer */
.footer {
  padding: 20px;
  text-align: center;
  margin-top: 40px;
  background-color: rgba(0,0,0,0.6);
}

.footer h2{
  margin:0;
}

/* Animation */
@keyframes fadeEffect {
  from {opacity:0; transform: translateY(10px);}
  to {opacity:1; transform: translateY(0);}
}

/* Responsive */
@media screen and (max-width: 800px) {
  .leftcolumn, .rightcolumn {   
    width: 100%;
    padding: 0;
  }
}

@media screen and (max-width: 400px) {
  .topnav {
    flex-direction: column;
    align-items: center;
  }

  .topnav a {
    width: 100%;
  }
}
</style>
</head>

<body>

<div class="header">
  <h1>Video Gallery</h1>
</div>

<div class="topnav">
    <a href="Menu.html">Menu</a>
  <a href="LCBA.html">About LCBA</a>
  <a href="TVL-HE.html">TVL-HE</a>
  <a href="Image Gallery.html">Image Gallery</a>
  <a href="Video gallery.html">Video Gallery</a>
  <a href="Games.html">Games</a>
</div>

<div class="row">
  <div class="leftcolumn">
    <div class="card">
      <h1>Video Gallery</h1>
  <video class="card-video" controls>

    Your browser does not support the video tag.
  </video>
</div>
      
    
      
    </div>
    
  </div>

    </div>

    
  </div>
</div>

<div class="footer">
  <h2>Project</h2>
</div>

</body>
</html>
